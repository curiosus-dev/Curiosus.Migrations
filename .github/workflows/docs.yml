# Synced from https://github.com/curiosus-dev/dotnet-tools, do not edit in place.
#
# Builds the Docusaurus site from docs/ and docs.json (READMEs and CHANGELOGs are symlinked into docs/)
# and deploys it to GitHub Pages from main: https://<owner>.github.io/<repository>/

name: Docs

on:
  push:
    branches: [ main ]
    paths: [ 'docs/**', 'website/**', 'docs.json', '**/README.md', '**/CHANGELOG.md', '.github/workflows/docs.yml' ]
  pull_request:
    paths: [ 'docs/**', 'website/**', 'docs.json', '**/README.md', '**/CHANGELOG.md', '.github/workflows/docs.yml' ]
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - if: github.event_name != 'pull_request' && github.ref_name == 'main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/build

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      pages: write # deploys the site
      id-token: write # OIDC token of the Pages deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
